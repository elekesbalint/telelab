<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench · TeleLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="workbench.css">
</head>
<body class="wb-body">
<header class="bar" id="topbar">
  <a class="brand" href="/">Tele<span>Lab</span></a>
  <nav class="nav" aria-label="Main menu">
    <a href="/">Live</a><a href="/workbench.html">Workbench</a><a href="/sessions.html">Sessions</a><a href="/connect.html">Connect</a><a href="/team.html">Team</a>
  </nav>
  <span class="session"></span>
  <div class="userbox" id="me"></div>
</header>

<div class="wb-tools" id="tools">
  <label class="sr" for="feed">Driver</label>
  <select id="feed" class="wb-select"></select>
  <label class="sr" for="view">View</label>
  <select id="view" class="wb-select"></select>
  <p class="wb-status" id="status" data-state="off">Not connected</p>
  <div class="wb-actions">
    <button class="wb-btn edit-only primary" id="add">Add panel</button>
    <button class="wb-btn" id="edit" aria-pressed="false">Edit</button>
    <button class="wb-btn" id="save">Save</button>
    <button class="wb-btn" id="save-as">Save as new</button>
    <button class="wb-btn" id="delete-view">Delete view</button>
    <button class="wb-btn" id="rename">Rename drivers</button>
    <button class="wb-btn" id="export">Export</button>
    <button class="wb-btn" id="import">Import</button>
    <button class="wb-btn" id="hide-nav" aria-pressed="false">Hide menu</button>
    <button class="wb-btn" id="fullscreen">Fullscreen</button>
  </div>
</div>

<main class="wb-grid" id="grid" aria-live="off"></main>
<p class="wb-empty" id="empty" hidden>No data on this port right now. Pick a live driver above, or start the game.</p>

<dialog id="catalog" class="wb-dialog">
  <form method="dialog">
    <h2>Add panel</h2>
    <div class="catalog" id="catalog-list"></div>
    <button class="wb-btn" value="cancel">Close</button>
  </form>
</dialog>

<dialog id="aliases" class="wb-dialog">
  <form method="dialog" id="alias-form">
    <h2>Rename drivers</h2>
    <p class="hint">Enter the name TeleLab should show next to each in-game name. Applies to the whole team. Leave empty to keep the original name.</p>
    <div class="alias-list" id="alias-list"></div>
    <div class="dialog-actions">
      <button class="wb-btn" value="cancel">Cancel</button>
      <button class="wb-btn primary" value="save" id="alias-save">Save</button>
    </div>
  </form>
</dialog>

<input type="file" id="import-file" accept="application/json,.json" hidden>
<script type="module" src="workbench.js"></script>
</body>
</html>
