<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · TeleLab by Bálint Elekes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body class="gate">
<main class="gate-box">
  <p class="brand">Tele<span>Lab</span><small class="brand-by">by Bálint Elekes</small></p>
  <h1>Team telemetry for F1 26</h1>
  <p class="lead">Sign in with your Discord account. If you are a member of the team's Discord server, you get in straight away with your own telemetry port.</p>
  <a class="discord" href="/auth/discord">Sign in with Discord</a>
  <p class="error" id="error" hidden></p>
</main>
<script>
  const reasons = {
    denied: "You cancelled the sign-in on Discord. Try again and allow access.",
    state: "The sign-in expired or started in another window. Click the button again.",
    discord: "Discord did not respond properly. Try again in a few seconds.",
    db: "The server could not save your sign-in. Tell the team owner.",
    code: "Discord sent no sign-in code. Click the button again.",
  };
  const err = new URLSearchParams(location.search).get("error");
  if (err) { const el = document.getElementById("error"); el.textContent = reasons[err] || "Sign-in failed, please try again."; el.hidden = false; }
</script>
</body>
</html>
