<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessions · TeleLab by Bálint Elekes & Tamás Gál</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body class="has-side">
<aside class="side" id="side" aria-label="Sections"></aside>
<div class="maincol">
<header class="bar">
  <a class="brand" href="/">Tele<span>Lab</span></a>
  <div id="feed-pick"></div>
  <p class="session" id="session"></p>
  <div class="userbox" id="me"></div>
</header>

<main class="ses">
  <div class="ses-head">
    <h1>Sessions</h1>
    <div class="ses-tools">
      <label class="ses-search">
        <span class="sr">Search sessions</span>
        <input type="search" id="q" placeholder="Search sessions…" autocomplete="off">
      </label>
      <label class="ses-check"><input type="checkbox" id="starred"> Starred only</label>
      <button type="button" class="btn" id="refresh">Refresh</button>
    </div>
  </div>
  <p class="ses-summary" id="summary">Loading…</p>

  <section class="ses-block" id="block-active" hidden>
    <h2 id="active-title">Active sessions</h2>
    <div class="ses-list" id="active"></div>
  </section>

  <section class="ses-block">
    <h2 id="closed-title">Closed sessions</h2>
    <div class="ses-list" id="closed"></div>
    <button type="button" class="ses-more" id="more" hidden>Show more</button>
  </section>
</main>
</div>
<script type="module" src="sessions.js"></script>
</body>
</html>
