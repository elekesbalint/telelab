<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stint Leaderboard · TeleLab by Bálint Elekes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body class="has-side">
<aside class="side" id="side" aria-label="Sections"></aside>
<div class="maincol">
<header class="bar">
  <a class="brand" href="/">Tele<span>Lab</span></a>
  <div id="feed-pick"></div>
  <p class="session" id="session"></p>
  <div class="userbox" id="me"></div>
</header>
<main class="lb">
  <div class="lb-head">
    <div>
      <h1>Stint Leaderboard</h1>
      <p class="lead">Top 5 quickest completed 50% races per circuit, by total race time. Session review, lap inputs, race ERS and setup stay available for every listed race.</p>
    </div>
  </div>
  <div class="lb-tools">
    <span class="ses-badge spec">F1 26</span>
    <select id="track"><option value="">All tracks</option></select>
    <select id="cond">
      <option value="">All conditions</option>
      <option value="DRY">Dry</option>
      <option value="INTER">Intermediate</option>
      <option value="WET">Wet</option>
    </select>
    <select id="driver"><option value="">All drivers</option></select>
    <select id="online">
      <option value="">Both</option>
      <option value="online">Online</option>
      <option value="offline">Offline</option>
    </select>
    <button type="button" class="btn" id="refresh">Refresh</button>
  </div>
  <div id="list"></div>
</main>
</div>
<div class="trk-modal" id="modal" hidden>
  <div class="trk-modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header><h2 id="modal-title">Setup</h2><button type="button" class="btn" id="modal-close">×</button></header>
    <div id="modal-body"></div>
  </div>
</div>
<script type="module" src="stints.js"></script>
</body>
</html>
