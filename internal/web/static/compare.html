<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lap comparison · TeleLab by Bálint Elekes & Tamás Gál</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/uPlot.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="has-side">
<aside class="side" id="side" aria-label="Sections"></aside>
<div class="maincol">
<header class="bar">
  <a class="brand" href="/">Tele<span>Lab</span></a>
  <span class="session"></span>
  <div class="userbox" id="me"></div>
</header>
<main class="cmp">
  <p class="back"><a id="back" href="/sessions.html">Back to the session</a></p>

  <div class="cmp-head">
    <section class="lapcard a" id="card-a"></section>
    <section class="lapcard b" id="card-b"></section>
    <section class="panel verdict" id="verdict"></section>
  </div>

  <div class="cmp-body">
    <div class="charts" id="charts"></div>
    <aside class="panel map">
      <h2>Who was faster around the lap</h2>
      <canvas id="map" aria-label="Track map: the line colour shows which lap gained time on each part of the track"></canvas>
      <ul class="legend-row"><li class="ka">A gained time</li><li class="kb">B gained time</li></ul>
      <dl class="kv" id="readout"></dl>
    </aside>
  </div>
</main>
<script src="vendor/uPlot.iife.min.js"></script>
<script type="module" src="compare.js"></script>
</div>
</body>
</html>
