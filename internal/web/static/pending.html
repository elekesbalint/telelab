<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awaiting approval · TeleLab by Bálint Elekes & Tamás Gál</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="/logo.png">
</head>
<body class="gate">
<main class="gate-box">
  <p class="brand"><img src="/logo.png" alt="">Tele<span>Lab</span><small class="brand-by">by Bálint Elekes & Tamás Gál</small></p>
  <h1 id="title">Your access is awaiting approval</h1>
  <p class="lead">We could not find you on the team's Discord server. Ask the team owner to approve you on the Team page. If you join the team server in the meantime, sign in again and you get in automatically.</p>
  <form method="post" action="/auth/logout"><button class="discord" type="submit">Log out and sign in again</button></form>
</main>
<script type="module">
  const me = await (await fetch("/api/me")).json().catch(() => null);
  if (me && me.role !== "pending") location.href = "/";
  else if (me) document.getElementById("title").textContent = `Hi ${me.displayName}, your access is awaiting approval`;
</script>
</body>
</html>
